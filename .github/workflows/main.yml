name: CI Workflow for DevOps App

on: push

jobs:
  UnitTests:
    name: Unit Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'adopt'
      - name: Run Unit Tests
        run: mvn -Dtest=com.napier.devops.AppTest test

  IntegrationTests:
    name: Integration Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'adopt'
      - name: Start MySQL container
        run: |
          docker run --name employees \
            -e MYSQL_ROOT_PASSWORD=root \
            -e MYSQL_DATABASE=employees \
            -e MYSQL_USER=test \
            -e MYSQL_PASSWORD=test \
            -p 33060:3306 -d mysql:8
      - name: Wait for MySQL to be ready
        run: |
          for i in {1..30}; do
            if docker exec employees mysql -u test -ptest -e "SELECT 1;" employees; then
              echo "MySQL is ready"
              break
            fi
            echo "Waiting for MySQL..."
            sleep 2
          done
      - name: Run Integration Tests
        run: mvn -Dtest=com.napier.devops.AppIntegrationTest test
      - name: Stop and remove MySQL container
        run: |
          docker stop employees
          docker rm employees

  Build:
    name: Build and Start Using docker-compose
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'adopt'
      - name: Package and Run docker-compose
        run: |
          mvn package -DskipTests
          docker compose up --abort-on-container-exit
